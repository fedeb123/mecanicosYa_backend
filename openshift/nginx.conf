# Igual que frontend/nginx.conf, adaptado a OpenShift:
# - escucha en 8080 porque el contenedor corre sin root;
# - los nombres de los servicios son Services del cluster, con IP fija, así que no hace
#   falta el resolver de Docker. Si un pod está caído, nginx devuelve 502/503 y el front lo muestra.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /mechanic/ {
        proxy_pass http://mechanic-service:8081/;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    location /assistance/ {
        proxy_pass http://assistance-service:8082/;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    location /dispatch/ {
        proxy_pass http://dispatch-service:8083/;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
