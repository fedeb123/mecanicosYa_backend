server:
  port: ${SERVER_PORT:8081}

spring:
  threads:
    virtual:
      # Cada request HTTP corre en un virtual thread (Java 21+).
      enabled: true
  application:
    name: mechanic-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mechanics_db}
    username: ${DB_USERNAME:mechanics_user}
    password: ${DB_PASSWORD:mechanics_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
  security:
    oauth2:
      resourceserver:
        jwt:
          # La clave pública de identity-service, que firma los tokens.
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8084/.well-known/jwks.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

mecanicosya:
  api:
    # Lo que muestran Swagger y el contrato exportado en docs/contratos/.
    description: "Perfiles de mecánicos, habilidades, tipos de vehículo, disponibilidad y ubicación, aprobación por un admin y calificaciones. Publica mechanic.events y consume assistance.events."

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"

