services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: mecanicosya_admin
      POSTGRES_PASSWORD: mecanicosya_admin_pass
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - mecanicosya-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      # Por TCP: durante el primer arranque Postgres corre los scripts de init escuchando sólo en el socket local,
      # y recién después abre el puerto. Así nadie se conecta antes de que existan las bases.
      test: ["CMD-SHELL", "pg_isready -h localhost -U mecanicosya_admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Crea las bases que falten en un volumen ya existente y termina.
  postgres-setup:
    image: postgis/postgis:16-3.4
    environment:
      PGPASSWORD: mecanicosya_admin_pass
    command: ["psql", "-h", "postgres", "-U", "mecanicosya_admin", "-d", "postgres", "-v", "ON_ERROR_STOP=1",
              "-f", "/sql/ensure-identity-db.sql"]
    volumes:
      - ./infra/postgres/ensure-identity-db.sql:/sql/ensure-identity-db.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  kafka:
    image: apache/kafka:4.1.0
    environment:
      # Un solo nodo en modo KRaft (broker y controller), sin Zookeeper.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    environment:
      KAFKA_CLUSTERS_0_NAME: mecanicosya
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy

  identity-service:
    restart: on-failure
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        MODULE: identity-service
    environment:
      SERVER_PORT: 8084
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_URL: jdbc:postgresql://postgres:5432/identity_db
      DB_USERNAME: identity_user
      DB_PASSWORD: identity_pass
      SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT: 60000
      # El admin que aprueba mecánicos. Para la demo local; en otro entorno se pasan desde la terminal.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@mecanicosya.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin-demo-123}
      # Los servicios que llaman a otros por REST piden su token con estos secretos.
      ASSISTANCE_SERVICE_SECRET: ${ASSISTANCE_SERVICE_SECRET:-assistance-dev-secret}
      DISPATCH_SERVICE_SECRET: ${DISPATCH_SERVICE_SECRET:-dispatch-dev-secret}
    ports:
      - "8084:8084"
    depends_on:
      postgres-setup:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  mechanic-service:
    restart: on-failure
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        MODULE: mechanic-service
    environment:
      SERVER_PORT: 8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_URL: jdbc:postgresql://postgres:5432/mechanics_db
      DB_USERNAME: mechanics_user
      DB_PASSWORD: mechanics_pass
      SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT: 60000
      IDENTITY_JWKS_URI: http://identity-service:8084/.well-known/jwks.json
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  dispatch-service:
    restart: on-failure
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        MODULE: dispatch-service
    environment:
      SERVER_PORT: 8083
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_URL: jdbc:postgresql://postgres:5432/dispatch_db
      DB_USERNAME: dispatch_user
      DB_PASSWORD: dispatch_pass
      SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT: 60000
      MECHANIC_SERVICE_URL: http://mechanic-service:8081
      ASSISTANCE_SERVICE_URL: http://assistance-service:8082
      IDENTITY_SERVICE_URL: http://identity-service:8084
      IDENTITY_JWKS_URI: http://identity-service:8084/.well-known/jwks.json
      SERVICE_CLIENT_SECRET: ${DISPATCH_SERVICE_SECRET:-dispatch-dev-secret}
      # nearest, best-rated o fastest-eta (el que llega antes por calle)
      DISPATCH_MATCHING_STRATEGY: ${DISPATCH_MATCHING_STRATEGY:-nearest}
      # Se toma de la terminal que corre docker compose; sin clave el tiempo de llegada se estima en línea recta.
      ORS_API_KEY: ${ORS_API_KEY:-}
      ORS_PROFILE: ${ORS_PROFILE:-driving-car}
    ports:
      - "8083:8083"
    depends_on:
      mechanic-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  assistance-service:
    restart: on-failure
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        MODULE: assistance-service
    environment:
      SERVER_PORT: 8082
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_URL: jdbc:postgresql://postgres:5432/assistances_db
      DB_USERNAME: assistances_user
      DB_PASSWORD: assistances_pass
      SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT: 60000
      DISPATCH_SERVICE_URL: http://dispatch-service:8083
      IDENTITY_SERVICE_URL: http://identity-service:8084
      IDENTITY_JWKS_URI: http://identity-service:8084/.well-known/jwks.json
      SERVICE_CLIENT_SECRET: ${ASSISTANCE_SERVICE_SECRET:-assistance-dev-secret}
      # Se toman de la terminal que corre docker compose; sin clave se clasifica con palabras clave.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TRIAGE_MODEL: ${TRIAGE_MODEL:-claude-opus-5-5}
    ports:
      - "8082:8082"
    depends_on:
      dispatch-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"

volumes:
  mecanicosya-postgres-data:
