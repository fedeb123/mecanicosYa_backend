      margin-bottom: 0.5rem;

    h1 {

      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .subtitle { color: var(--color-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
