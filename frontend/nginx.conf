# Sirve el front estático y hace de proxy hacia los tres servicios,
# así el navegador habla con un solo origen y no hace falta CORS.
server {
    listen 80;
    server_name _;

    # DNS interno de Docker. Resolver en cada request (proxy_pass con variable)
    # permite que nginx arranque aunque un servicio esté caído y que el front
    # muestre el 502 en vez de fallar entero.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    location /mechanic/ {
        set $upstream http://mechanic-service:8081;
        rewrite ^/mechanic/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    location /assistance/ {
        set $upstream http://assistance-service:8082;
        rewrite ^/assistance/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    location /dispatch/ {
        set $upstream http://dispatch-service:8083;
        rewrite ^/dispatch/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
