server:
  port: ${SERVER_PORT:8082}

spring:
  threads:
    virtual:
      # Cada request HTTP corre en un virtual thread (Java 21+).
      enabled: true
  application:
    name: assistance-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/assistances_db}
    username: ${DB_USERNAME:assistances_user}
    password: ${DB_PASSWORD:assistances_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
  security:
    oauth2:
      resourceserver:
        jwt:
          # La clave pública de identity-service, que firma los tokens.
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8084/.well-known/jwks.json}

mecanicosya:
  security:
    identity-url: ${IDENTITY_SERVICE_URL:http://localhost:8084}
    # Con secreto, las llamadas a dispatch-service llevan un token de servicio. Lo comparte con identity-service.
    service-client:
      secret: ${SERVICE_CLIENT_SECRET:}

clients:
  dispatch-service:
    base-url: ${DISPATCH_SERVICE_URL:http://localhost:8083}
    timeout: ${DISPATCH_SERVICE_TIMEOUT:5s}

assistance:
  requests:
    # Un pedido que estuvo en cola en el teléfono más de esto se rechaza con 422 REQUEST_EXPIRED
    max-age: ${ASSISTANCE_REQUEST_MAX_AGE:PT15M}
    max-clock-skew: ${ASSISTANCE_MAX_CLOCK_SKEW:PT5M}
  offers:
    # Cada cuánto se pasan a UNMATCHED los pedidos cuya ronda de ofertas venció
    expiry-check: ${ASSISTANCE_OFFER_EXPIRY_CHECK:PT15S}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"

triage:
  anthropic:
    # Sin clave, los pedidos se clasifican sólo con palabras clave. Nunca se pone la clave en el repo.
    api-key: ${ANTHROPIC_API_KEY:}
    base-url: ${TRIAGE_ANTHROPIC_BASE_URL:}
    model: ${TRIAGE_MODEL:claude-opus-5-5}
    effort: ${TRIAGE_EFFORT:low}
    # Pasado este tiempo se usa el clasificador por palabras clave y el pedido sigue.
    timeout: ${TRIAGE_TIMEOUT:PT10S}
    max-retries: ${TRIAGE_MAX_RETRIES:1}
    max-tokens: ${TRIAGE_MAX_TOKENS:2048}
    refusal-fallback: ${TRIAGE_REFUSAL_FALLBACK:true}
